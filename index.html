<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍳 AI Tạo Thực Đơn</title>
  <meta name="description" content="Ứng dụng AI gợi ý món ăn từ nguyên liệu bạn có, hỗ trợ chế độ ăn kiêng và dị ứng thực phẩm." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind custom config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
        },
      },
    }
  </script>

  <!-- Custom stylesheet -->
  <link rel="stylesheet" href="static/style.css" />
</head>

<body class="min-h-screen bg-gradient-to-br from-[#0f0c29] via-[#1a1044] to-[#0f0c29] text-slate-100">

  <!-- Decorative blobs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-700 rounded-full opacity-20 blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-80 h-80 bg-violet-500 rounded-full opacity-15 blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/3 w-72 h-72 bg-indigo-600 rounded-full opacity-20 blur-3xl"></div>
  </div>

  <main class="relative z-10 max-w-2xl mx-auto px-4 py-12">

    <!-- Header -->
    <header class="text-center mb-10">
      <span class="text-5xl">🍳</span>
      <h1 class="mt-3 text-4xl font-extrabold tracking-tight bg-gradient-to-r from-violet-300 via-purple-200 to-indigo-300 bg-clip-text text-transparent">
        AI Tạo Thực Đơn
      </h1>
      <p class="mt-2 text-slate-400 text-sm">Nhập nguyên liệu, để AI lo phần còn lại</p>
    </header>

    <!-- Form Card -->
    <section class="glass rounded-2xl p-7 shadow-2xl mb-8">
      <form id="recipeForm" novalidate>

        <!-- Nguyên liệu -->
        <div class="mb-5">
          <label for="ingredients" class="block text-sm font-semibold mb-2 text-violet-300">
            🥦 Nguyên liệu hiện có <span class="text-red-400">*</span>
          </label>
          <textarea
            id="ingredients"
            name="ingredients"
            rows="3"
            placeholder="VD: thịt gà, cà chua, hành tây, tỏi, ớt..."
            required
            class="input-field w-full rounded-xl px-4 py-3 text-sm resize-none"
          ></textarea>
          <p id="ingredientsError" class="mt-1.5 text-xs text-red-400 hidden">
            Vui lòng nhập ít nhất một nguyên liệu.
          </p>
        </div>

        <!-- Chế độ ăn -->
        <div class="mb-5">
          <label for="diet" class="block text-sm font-semibold mb-2 text-violet-300">
            🥗 Chế độ ăn kiêng
          </label>
          <select
            id="diet"
            name="diet"
            class="input-field w-full rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer"
          >
            <option value="Không">Không (Ăn bình thường)</option>
            <option value="Chay">🌿 Chay</option>
            <option value="Eat Clean">🥙 Eat Clean</option>
            <option value="Keto">🥩 Keto</option>
          </select>
        </div>

        <!-- Dị ứng -->
        <div class="mb-7">
          <label for="allergies" class="block text-sm font-semibold mb-2 text-violet-300">
            ⚠️ Thực phẩm dị ứng
            <span class="text-slate-500 font-normal">(không bắt buộc)</span>
          </label>
          <input
            type="text"
            id="allergies"
            name="allergies"
            placeholder="VD: đậu phộng, hải sản, sữa..."
            class="input-field w-full rounded-xl px-4 py-3 text-sm"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="btn-primary w-full py-3.5 rounded-xl font-bold text-white text-base flex items-center justify-center gap-2 shadow-lg"
        >
          <span id="btnIcon">🍽️</span>
          <span id="btnText">Tạo thực đơn ngay</span>
        </button>

      </form>
    </section>

    <!-- Loading State -->
    <div id="loadingState" class="hidden text-center py-10">
      <div class="inline-flex flex-col items-center gap-4">
        <div class="w-14 h-14 rounded-full border-4 border-violet-400 border-t-transparent animate-spin-slow shadow-lg shadow-violet-500/30"></div>
        <p class="text-violet-300 font-semibold text-lg animate-pulse">Đang xử lý… ⚙️</p>
        <p class="text-slate-500 text-xs">Đang phân tích nguyên liệu và tạo công thức</p>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden glass border border-red-500/40 bg-red-500/10 rounded-xl px-5 py-4 mb-6 flex items-start gap-3">
      <span class="text-xl mt-0.5">❌</span>
      <div>
        <p class="font-semibold text-red-300 text-sm">Có lỗi xảy ra</p>
        <p id="errorMessage" class="text-red-400/80 text-xs mt-1"></p>
      </div>
    </div>

    <!-- Result Card -->
    <article id="resultCard" class="hidden">
      <div class="glass rounded-2xl overflow-hidden shadow-2xl">

        <!-- Card Header -->
        <div class="bg-gradient-to-r from-violet-700/60 to-indigo-700/50 px-6 py-5 border-b border-white/10">
          <p class="text-xs font-semibold uppercase tracking-widest text-violet-300 mb-1">✨ Món AI gợi ý</p>
          <h2 id="dishName" class="text-2xl font-extrabold text-white leading-tight"></h2>
          <div class="mt-2 inline-flex items-center gap-1.5 bg-amber-400/15 border border-amber-400/40 rounded-full px-3 py-1">
            <span class="text-amber-300 text-xs">🔥</span>
            <span id="calories" class="text-amber-300 text-xs font-semibold"></span>
          </div>
        </div>

        <!-- Recipe Steps -->
        <div class="px-6 py-6">
          <h3 class="text-sm font-bold uppercase tracking-wider text-violet-300 mb-4">📋 Công thức nấu</h3>
          <ol id="recipeSteps" class="space-y-3"></ol>
        </div>

        <!-- Reset Button -->
        <div class="px-6 pb-6">
          <button
            onclick="resetForm()"
            class="w-full py-3 rounded-xl border border-violet-500/50 text-violet-300 font-semibold text-sm hover:bg-violet-500/10 transition-colors"
          >
            🔄 Tạo món khác
          </button>
        </div>

      </div>
    </article>

  </main>

  <!-- Main JavaScript -->
  <script src="static/main.js"></script>
</body>
</html>
